<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Bé học tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg1:#c79cf2;--bg2:#fde8f6;--card:#fff;--ink:#2d1546;--pri:#7b2cbf;--red:#e53935;--gold:#ff8fc7;--soft:#f4e6fc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b1a5a;--bg2:#170a26;--card:#2a1744;--ink:#f6e9ff;--soft:#3c2260}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2)) fixed}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cloud{position:absolute;font-size:48px;opacity:.75;animation:drift linear infinite}
.star{position:absolute;font-size:22px;animation:tw 2.5s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
@keyframes tw{50%{opacity:.2;transform:scale(.7)}}
@keyframes bob{50%{transform:translateY(-8px)}}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:12px 14px 130px}
h1{margin:6px 0;font-size:28px;text-align:center}
h1 span{display:inline-block}
#bell{font-size:40px;cursor:pointer;animation:bob 2s ease-in-out infinite;transform-origin:top center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -4px 0 #0002}
button{font:inherit;color:inherit;cursor:pointer}
nav button{flex:1;max-width:220px;min-height:76px;border:0;border-radius:24px;background:var(--soft);font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s}
nav button .ni{font-size:34px;line-height:1}
nav button.on{background:var(--gold);color:#4a1238;transform:translateY(-6px);box-shadow:0 4px 0 #0003}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;font-size:14px}
select,input[type=text]{font:inherit;padding:8px 10px;border-radius:14px;border:2px solid var(--pri);background:var(--card);color:var(--ink)}
.btn{border:0;border-radius:20px;padding:10px 16px;background:var(--pri);color:#fff;font-weight:700;box-shadow:0 3px 0 #0004}
.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:#4a1238}.btn.ghost{background:var(--card);color:var(--ink)}

/* Grid chủ đề */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--card);color:var(--ink);border-radius:26px;padding:12px 8px;text-align:center;border:3px solid var(--pri);box-shadow:0 5px 0 #0003;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;transition:transform .1s;position:relative}
.tile:active{transform:scale(.93)}
.tile-thumb{width:100%;aspect-ratio:1.2;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:clamp(36px,9vw,56px);overflow:hidden}
.tile-thumb img{width:100%;height:100%;object-fit:cover}
.tile .nm{font-weight:800;font-size:clamp(14px,3.6vw,18px);word-break:break-word;color:var(--ink);margin-top:2px}
.tile.add{border-style:dashed;background:transparent;justify-content:center}

/* Card từ vựng */
.words-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:768px){.words-grid{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--card);border-radius:28px;padding:20px;text-align:center;box-shadow:0 6px 0 #0003;position:relative}
.pic{width:100%;aspect-ratio:1.1;border-radius:22px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:clamp(100px,25vw,160px);overflow:hidden;cursor:pointer}
.pic img{width:100%;height:100%;object-fit:cover}
.w{font-size:36px;font-weight:800;margin:12px 0 2px}
.vi{font-size:20px;opacity:.8;font-weight:600}

.sentence-box{margin-top:14px;background:var(--soft);border-radius:18px;padding:14px;text-align:left;border:2px dashed var(--pri)}
.sentence-title{font-weight:800;font-size:16px;color:var(--pri);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.sentence-item{margin-bottom:10px;font-size:15px;display:flex;flex-direction:column;gap:3px;background:var(--card);padding:8px 12px;border-radius:12px;box-shadow:0 2px 4px #0001}
.sentence-en{font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.sentence-vi{font-size:14px;color:#555;font-style:italic}
.sentence-item.b{margin-left:18px;border-left:4px solid var(--pri)}
.guide details{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;text-align:left}
.guide summary{font-weight:800;font-size:17px;cursor:pointer}
.guide li{margin:6px 0;line-height:1.45}.guide ol,.guide ul{padding-left:22px}
.guide code{background:var(--soft);border-radius:6px;padding:1px 6px;font-size:13px}
.guide pre{background:var(--soft);border-radius:10px;padding:10px;font-size:13px;overflow-x:auto;white-space:pre}
.guide table{border-collapse:collapse;width:100%;font-size:13px}.guide td,.guide th{border:1px solid #0002;padding:6px;vertical-align:top}
.guide .tip{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.sentence-note{margin-top:10px;font-size:14px;opacity:.85}

.say{border:0;background:var(--gold);border-radius:50%;width:72px;height:72px;font-size:36px;margin-top:10px;box-shadow:0 4px 0 #0003}
.say:active{transform:scale(.9)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.msg{text-align:center;padding:16px;background:var(--card);border-radius:18px}
.ov{position:fixed;inset:0;z-index:10;background:linear-gradient(var(--bg1),var(--bg2));display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));gap:10px;overflow-y:auto}
.ov .big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:8px;text-align:center}
.ov .big .pic{width:min(85vw,60vh);cursor:default;font-size:min(45vw,35vh)}
.ov .big .w{font-size:44px}
.ctl{display:flex;gap:10px;justify-content:center}
.ctl .btn{flex:1;max-width:160px;font-size:18px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.song{border-radius:22px;color:#fff;padding:14px 10px;text-align:center;box-shadow:0 4px 0 #0003}
.song .pl{font-size:44px;cursor:pointer}
.song .t{font-weight:800;margin:4px 0;word-break:break-word}
.song button{border:0;background:#fff4;border-radius:12px;padding:4px 8px;margin:2px;color:#fff}
.frame{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000}
a{color:var(--pri);font-weight:700}
.stars{background:var(--gold);color:#4a1238;border-radius:20px;padding:2px 12px;font-size:22px;vertical-align:middle;box-shadow:0 3px 0 #0003}
.sky::after{content:'';position:absolute;left:-10%;right:-10%;bottom:0;height:20vh;background:radial-gradient(ellipse at 28% 100%,#7bd88f 55%,transparent 56%),radial-gradient(ellipse at 75% 100%,#5cc377 50%,transparent 51%)}
.bal{position:absolute;bottom:-80px;font-size:48px;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(8deg)}}
.pop{animation:pop .45s}
@keyframes pop{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}}
.ring{animation:ring .8s!important}
@keyframes ring{20%{transform:rotate(25deg)}40%{transform:rotate(-20deg)}60%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
.cf{position:fixed;top:-40px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.edit{border:0;background:var(--soft);border-radius:50%;width:44px;height:44px;font-size:22px;margin:10px 0 0 10px}
.topic-edit{position:absolute;top:6px;right:6px;background:var(--card);border:1px solid var(--pri);border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;z-index:2;box-shadow:0 2px 4px #0002}
.ctl .btn{min-height:64px}
.btn{min-height:48px}
.mascot{position:fixed;right:6px;bottom:calc(112px + env(safe-area-inset-bottom,0px));width:84px;z-index:4;cursor:pointer;animation:mfloat 3s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.mascot .m-in{width:100%}.mascot svg,.mascot .m-img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 0 #0003)}
.mascot .m-img{border-radius:50%;aspect-ratio:1;object-fit:cover;animation:sway 2.4s ease-in-out infinite}
.mascot.hop .m-in{animation:mhop .6s}
.mascot .bubble{position:absolute;right:50%;bottom:100%;margin-bottom:4px;background:#fff;color:#4a1238;border-radius:14px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 #0003;opacity:0;transform:translateX(30%) scale(.8);transition:.2s;pointer-events:none}
.mascot.talk .bubble{opacity:1;transform:translateX(30%) scale(1)}
.mascot .mbtn{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border:0;border-radius:50%;background:var(--card);box-shadow:0 2px 0 #0003;font-size:13px;padding:0;opacity:.85}
.wing-l{transform-origin:34px 66px;animation:flapL .5s ease-in-out infinite alternate}
.wing-r{transform-origin:86px 66px;animation:flapR .5s ease-in-out infinite alternate}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes flapL{from{transform:rotate(10deg)}to{transform:rotate(-16deg)}}
@keyframes flapR{from{transform:rotate(-10deg)}to{transform:rotate(16deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes mfloat{50%{transform:translateY(-10px)}}
@keyframes mhop{30%{transform:translateY(-26px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes sway{50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.mascot,.mascot *{animation:none!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
function el(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c==null?'':c)));return e}

try{
  const s=$('#sky');
  for(let i=0;i<5;i++){const c=el('div',{class:'cloud'},['🦇','💜','🖤','🎀','✨'][i%5]);c.style.top=(5+i*17)+'%';c.style.animationDuration=(40+i*12)+'s';c.style.animationDelay=(-i*9)+'s';s.append(c)}
  for(let i=0;i<10;i++){const c=el('div',{class:'star'},i%2?'⭐':'✨');c.style.left=Math.random()*95+'%';c.style.top=Math.random()*90+'%';c.style.animationDelay=Math.random()*2+'s';s.append(c)}
  ['🎈','🪁','🎈'].forEach((b,i)=>{const d=el('div',{class:'bal'},b);d.style.left=(15+i*32)+'%';d.style.animationDuration=(28+i*9)+'s';d.style.animationDelay=(-i*11)+'s';s.append(d)});
}catch(e){}

let topics=[],songs=[];
let st={page:'home',topic:null,busy:''};
let cfg={voice:'',rate:'slow',stars:0};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('cfg')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}};

const defaultTopics = [
  {id:'t1', name:'Transportation (Giao thông)', icon:'🚗', words:[
    {
      en:'Bus', vi:'Xe buýt', emoji:'🚌',
      sentences:[
        {en:"A: What's this?", vi:"(Hỏi: Đây là cái gì?)"},
        {en:"B: This is a bus.", vi:"(Đáp: Đây là xe buýt.)"},
        {en:"A: Where do you see a bus?", vi:"(Hỏi: Bạn nhìn thấy xe buýt ở đâu?)"},
        {en:"B: I see a bus on the road.", vi:"(Đáp: Tôi nhìn thấy xe buýt trên đường.)"}
      ]
    },
    {
      en:'Motorbike', vi:'Xe máy', emoji:'🛵',
      sentences:[
        {en:"A: How do you go to school?", vi:"(Hỏi: Bạn đến trường bằng phương tiện gì?)"},
        {en:"B: I go by motorbike.", vi:"(Đáp: Tôi đi đến trường bằng xe máy.)"}
      ]
    }
  ]}
];

try{
  const saved = localStorage.getItem('topics');
  if(saved) {
    const parsed = JSON.parse(saved);
    if(Array.isArray(parsed) && parsed.length > 0) {
      topics = parsed;
    } else {
      topics = defaultTopics;
    }
  } else {
    topics = defaultTopics;
  }
  songs = JSON.parse(localStorage.getItem('songs')) || [];
}catch(e){
  topics = defaultTopics; 
  songs = [];
}

const saveTopics=()=>{try{localStorage.setItem('topics',JSON.stringify(topics))}catch(e){}}
const saveSongs=()=>{try{localStorage.setItem('songs',JSON.stringify(songs))}catch(e){}}

let voices=[];
function loadV(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));drawBar()}catch(e){}}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadV;loadV()}
const clean=t=>String(t||'').replace(/^\s*[AB]\s*:\s*/i,'').replace(/\s*\/\s*/g,' or ');
function mk(t){const u=new SpeechSynthesisUtterance(clean(t));u.lang='en-US';const v=voices.find(v=>v.name===cfg.voice);if(v)u.voice=v;u.rate=cfg.rate==='slow'?.6:.95;return u}
function say(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.speak(mk(t))}
function sayAll(list){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();list.forEach(t=>speechSynthesis.speak(mk(t)))}
const viText=v=>{v=String(v||'').trim();return v&&!/^\(/.test(v)?'('+v+')':v};
function drawBar(){const b=$('#vbar');if(!b)return;b.replaceChildren();
const sv=el('select',{onchange:e=>{cfg.voice=e.target.value;save();say('Hello')}},el('option',{value:''},'🗣️ Giọng mặc định'),...voices.map(v=>el('option',{value:v.name},v.name+' ('+v.lang+')')));sv.value=cfg.voice;
const sr=el('select',{onchange:e=>{cfg.rate=e.target.value;save()}},el('option',{value:'slow'},'🐢 Đọc chậm'),el('option',{value:'normal'},'🐇 Đọc bình thường'));sr.value=cfg.rate;
b.append(sv,sr)}

function fileToBase64(file, maxDim) {
  return new Promise((resolve, reject) => {
    createImageBitmap(file).then(bm => {
      const k = Math.min(1, maxDim / Math.max(bm.width, bm.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bm.width * k);
      c.height = Math.round(bm.height * k);
      c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85));
    }).catch(reject);
  });
}

function pick(multi,cb,acc){const i=el('input',{type:'file',accept:acc||'image/*'});if(multi)i.multiple=true;i.onchange=()=>{if(i.files.length)cb([...i.files])};i.click()}
const pic=(w,onclick)=>{const p=el('div',{class:'pic',onclick},w.img?el('img',{src:w.img,alt:w.en}):(w.emoji||'🖼️'));return p};

<div class="msg" style="margin-bottom:10px"><b>📘 Hướng dẫn đưa app lên mạng</b><br>Dành cho bố mẹ. Làm 1 lần, sau đó bé mở app bằng đường link trên mọi thiết bị.</div>

<details open><summary>0️⃣ Vì sao phải đưa lên mạng?</summary>
<ul>
<li>Mở file HTML trực tiếp từ máy (<code>file://</code>) thì YouTube chặn phát video (lỗi cấu hình / Error 153) vì không biết trang nhúng đến từ đâu.</li>
<li>Đưa lên web (<code>https://</code>) thì video phát bình thường.</li>
</ul>
<div class="tip">💡 Ví dụ: như bán hàng ở chợ, nếu không có sạp (địa chỉ web) thì khách (YouTube) không biết bạn là ai nên không cho "bày bán" (phát video) cùng.</div>
<div class="tip">⚠️ <b>Bắt buộc đọc:</b> dữ liệu (chủ đề, ảnh, bài hát) lưu trong trình duyệt, theo từng <u>thiết bị + địa chỉ web</u>. Đổi link hoặc đổi máy là thấy app trống. Trước khi chuyển: vào tab Chủ đề bấm <b>💾 Backup Toàn Bộ App</b>; sang link mới bấm <b>🔄 Restore Backup</b>.<br>File backup gồm: chủ đề, hình ảnh, bài hát, số sao, cài đặt giọng đọc, ảnh linh vật. <u>Không</u> gồm Gemini API Key (hãy nhập lại).</div>
</details>

<details><summary>1️⃣ Chọn nền tảng nào?</summary>
<table>
<tr><th></th><th>Netlify</th><th>GitHub Pages</th><th>Firebase Hosting</th></tr>
<tr><td>Độ dễ</td><td>Dễ nhất (kéo thả)</td><td>Trung bình</td><td>Khó hơn (dùng dòng lệnh)</td></tr>
<tr><td>Ưu</td><td>Không cần cài gì, có link ngay</td><td>Lưu được lịch sử sửa code</td><td>Hạ tầng Google, tên miền web.app</td></tr>
<tr><td>Nhược</td><td>Link không đăng ký có thể bị xóa sau thời gian ngắn</td><td>Tài khoản miễn phí thường cần repo Public</td><td>Cần cài Node.js và gõ lệnh</td></tr>
</table>
<div class="tip">👉 Gợi ý: bắt đầu với <b>Netlify</b>. Các gói miễn phí và giới hạn có thể thay đổi, hãy xem trang giá của từng nền tảng.</div>
</details>

<details><summary>2️⃣ Chuẩn bị thư mục (dùng chung cho cả 3)</summary>
<p>Giải nén file <code>be-hoc-tieng-anh-deploy.zip</code>, bạn sẽ có:</p>
<pre>be-hoc-tieng-anh-deploy/
├─ public/index.html        ← chính là app
├─ netlify.toml             ← cấu hình Netlify
├─ firebase.json            ← cấu hình Firebase
├─ .firebaserc              ← điền ID project Firebase
└─ .github/workflows/pages.yml  ← cấu hình GitHub Pages</pre>
<ul>
<li>Muốn cập nhật app: thay file <code>public/index.html</code> bằng bản mới (giữ đúng tên <code>index.html</code>), rồi đưa lên lại.</li>
<li>Các file cấu hình đã bật sẵn chế độ gửi "nguồn trang" (Referrer-Policy) để YouTube nhận diện đúng.</li>
</ul>
</details>

<details><summary>3️⃣ Netlify (khuyên dùng)</summary>
<b>Cách A: Kéo thả (không cần cài gì)</b>
<ol>
<li>Vào <code>app.netlify.com</code>, đăng ký/đăng nhập (nên đăng ký để link giữ lâu dài).</li>
<li>Chọn <b>Add new site → Deploy manually</b> (hoặc vào <code>app.netlify.com/drop</code>).</li>
<li>Kéo <b>thư mục <code>public</code></b> (không kéo cả thư mục ngoài) vào khung.</li>
<li>Chờ vài giây, Netlify cấp link dạng <code>https://ten-ngau-nhien.netlify.app</code>.</li>
<li>Đổi tên đẹp: <b>Site configuration → Change site name</b>.</li>
<li>Cập nhật sau này: vào tab <b>Deploys</b>, kéo thả lại thư mục <code>public</code> mới.</li>
</ol>
<b>Cách B: Nối với GitHub (tự cập nhật khi sửa code)</b>
<ol>

const MASCOT_KEY='mascot_img';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

function collectBackup(){
  const {stars:_s, ...settings} = cfg;           // cài đặt giọng đọc... (sao tách riêng cho rõ)
  return {
    app: 'BeHocTiengAnh', version: 2, exportDate: new Date().toISOString(),
    stars: Number(cfg.stars)||0,
    topics: topics, songs: songs, settings: settings,
    mascot: lsGet(MASCOT_KEY)                    // ảnh linh vật riêng (nếu có); KHÔNG gồm Gemini API Key
  };
}

function exportFullBackup() {
  const data = collectBackup();
  const jsonStr = JSON.stringify(data);
  const blob = new Blob([jsonStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = 'BeHocTiengAnh_FullBackup_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  const nWords = data.topics.reduce((n,t)=>n+((t.words||[]).length),0);
  alert('Đã tạo file backup:\n• ' + data.topics.length + ' chủ đề (' + nWords + ' từ, gồm hình ảnh)\n• ' + data.songs.length + ' bài hát\n• ' + data.stars + ' sao\n• Cài đặt giọng đọc\n• Ảnh linh vật riêng: ' + (data.mascot ? 'có' : 'không') + '\n• Dung lượng: ' + (jsonStr.length/1048576).toFixed(2) + ' MB\n\nLưu ý: file không chứa Gemini API Key.');
}

function importFullBackup() {
  pick(false, ([f]) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        const hasAny = Array.isArray(data.topics) || Array.isArray(data.songs) || data.stars !== undefined || data.cfg || data.settings;
        if (!hasAny) throw new Error('Không thấy dữ liệu của app trong file này.');
        const oldStars = (data.cfg && data.cfg.stars);                // tương thích backup đời cũ (v1)
        const stars_ = data.stars !== undefined ? data.stars : oldStars;
        const info = '• ' + (Array.isArray(data.topics) ? data.topics.length : 0) + ' chủ đề\n• ' + (Array.isArray(data.songs) ? data.songs.length : 0) + ' bài hát\n• ' + (stars_ !== undefined ? Number(stars_)||0 : 'giữ nguyên') + ' sao\n• Ảnh linh vật: ' + (data.mascot ? 'có' : 'không');
        if (!confirm('Khôi phục từ file backup?\n' + info + '\n\nDữ liệu hiện tại trên thiết bị này sẽ bị THAY THẾ.')) return;
        const failed = [];
        if (Array.isArray(data.topics)) { topics = data.topics; if (!lsSet('topics', JSON.stringify(topics))) failed.push('chủ đề / hình ảnh'); }
        if (Array.isArray(data.songs)) { songs = data.songs; if (!lsSet('songs', JSON.stringify(songs))) failed.push('bài hát'); }
        const st = data.settings || (data.cfg ? (({stars:_x, ...r}) => r)(data.cfg) : null);
        if (st) Object.assign(cfg, st);
        if (stars_ !== undefined) cfg.stars = Number(stars_) || 0;
        if (!lsSet('cfg', JSON.stringify(cfg))) failed.push('số sao / cài đặt');
        if (data.mascot) { if (!lsSet(MASCOT_KEY, data.mascot)) failed.push('ảnh linh vật'); }
        else if (data.version >= 2) { try { localStorage.removeItem(MASCOT_KEY) } catch(e){} }
        if (window.rebuildMascot) window.rebuildMascot();
        stars(); render();
        alert(failed.length ? 'Khôi phục chưa đầy đủ: không lưu được ' + failed.join(', ') + ' (bộ nhớ trình duyệt đầy). Dữ liệu chỉ có tạm đến khi bạn tắt trang.' : 'Đã khôi phục thành công!');
      } catch (err) {
        alert('File backup không hợp lệ: ' + err.message);
      }
    };
    reader.readAsText(f);
  }, 'application/json');
}

const GEMINI_JSON_PROMPT = `Bạn là trợ lý chuyển đề cương tiếng Anh mầm non thành JSON. Tôi gửi kèm ảnh đề cương. Hãy đọc kỹ ảnh và chỉ trả về MỘT khối JSON (không giải thích thêm), đúng cấu trúc:

{"weeks":[{"week":"Tuần 1","title":"Land transportation + Emergency transportation (Phương tiện giao thông đường bộ và khẩn cấp)","words":[{"en":"Road","vi":"Con đường","emoji":"🛣️"}],"sentences":[{"en":"A: What's this?","vi":"(Hỏi: Đây là cái gì?)"},{"en":"B: This is a taxi.","vi":"(Đáp: Đây là xe taxi.)"}],"notes":["Song: ..."]}]}

Quy tắc:
1. Mỗi dòng "Tuần" trong bảng = 1 phần tử của "weeks". "title" = tên chủ đề ghi trong ảnh (kèm phần tiếng Việt trong ngoặc nếu có).
2. Cột "Từ vựng và bài hát": mọi từ vựng đưa vào "words", giữ nguyên tiếng Anh, không thêm bớt. Tên bài hát / Story Time đưa vào "notes", KHÔNG đưa vào "words".
3. Cột "Cấu trúc câu": chép NGUYÊN VĂN từng câu vào "sentences" theo đúng thứ tự trong ảnh, mỗi câu 1 phần tử, giữ tiền tố "A:" / "B:" và giữ nguyên dấu "/". Không bỏ sót, không gộp, không tự thêm câu.
4. "vi" của câu: dịch ngắn gọn, tự nhiên cho bé, BẮT BUỘC nằm trong ngoặc đơn. Câu A hỏi bắt đầu "(Hỏi: ...)", câu B trả lời bắt đầu "(Đáp: ...)", câu A nói một mình (không phải câu hỏi) bắt đầu "(Bé nói: ...)".
5. "vi" của từ: nghĩa tiếng Việt ngắn gọn. "emoji": 1 emoji phù hợp, nếu không có thì "🌟".
6. Tuần không có từ vựng (ví dụ ôn tập): "words" và "sentences" là [], nội dung ghi vào "notes".
7. Chỗ nào chữ mờ hoặc không chắc: giữ nguyên chữ nhìn thấy và thêm "(?)" phía sau, tuyệt đối không tự đoán.`;

function importJsonModal(){
  const ta = el('textarea',{placeholder:'Dán đoạn JSON cấu trúc chủ đề vào đây...',style:'width:100%;height:220px;font:inherit;border-radius:14px;padding:10px;border:2px solid var(--pri);background:var(--card);color:var(--ink)'});
  const close = modal('📥 Nhập JSON Chủ đề', ta, el('div',{class:'ctl'}, el('button',{class:'btn gold',onclick:()=>copyText(GEMINI_JSON_PROMPT)},'📋 Chép prompt cho Gemini'), el('button',{class:'btn',onclick:()=>{
    try{
      const data = JSON.parse(ta.value);
      let addedCount = 0;
      const weeksArr = Array.isArray(data) ? data : (data.weeks || data.topics || []);
      const cleanS = arr => (Array.isArray(arr)?arr:[]).filter(x=>x&&(x.en||x.vi)).map(x=>({en:String(x.en||''),vi:String(x.vi||'')}));
      weeksArr.forEach((w, idx)=>{
        const tName = w.week ? (w.week + (w.title ? ': ' + w.title : '')) : (w.name || w.title || ('Chủ đề ' + (topics.length + 1)));
        const wordsArr = (w.words || []).map(x => ({en: x.en || '', vi: x.vi || '', emoji: x.emoji || '🌟', sentences: cleanS(x.sentences)}));
        const sents = cleanS(w.sentences);
        const notes = Array.isArray(w.notes) ? w.notes.map(String) : [];
        if(wordsArr.length > 0 || sents.length > 0 || notes.length > 0){
          topics.push({id: 't' + Date.now() + '_' + idx, name: tName, icon: w.icon || '🚀', words: wordsArr, sentences: sents, notes: notes});
          addedCount++;
        }
      });
      if(addedCount > 0){
        saveTopics();
        alert('Đã nhập thành công ' + addedCount + ' chủ đề mới!');
        close();
        render();
      } else {
        alert('Không tìm thấy dữ liệu từ vựng hợp lệ trong JSON.');
      }
    }catch(err){
      alert('Lỗi định dạng JSON: ' + err.message);
    }
  }},'Xác nhận Nhập')));
}

window.GEMINI_HOOK = {
  enabled: true,
  apiKey: localStorage.getItem('GEMINI_API_KEY') || '',
  async generateImage(word, topic) {
    if (!this.apiKey) {
      const key = prompt('Nhập Gemini API Key của bạn (sẽ được lưu trong trình duyệt):');
      if (key && key.trim()) {
        this.apiKey = key.trim();
        localStorage.setItem('GEMINI_API_KEY', this.apiKey);
      } else {
        return null;
      }
    }
    const promptText = `Cute cartoon illustration of ${word.en} (${word.vi || ''}), pastel background, simple style for 5 year old kids, centered object, 1:1 square aspect ratio, no text, no words, no letters, high quality vector art style.`;
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:generateImages?key=${this.apiKey}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt: promptText, config: {numberOfImages: 1, outputMimeType: 'image/jpeg', aspectRatio: '1:1'}})
      });
      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        alert('Lỗi tạo ảnh từ Gemini: ' + (errData.error?.message || response.statusText));
        return null;
      }
      const data = await response.json();
      if (data.generatedImages && data.generatedImages.length > 0) {
        return 'data:image/jpeg;base64,' + data.generatedImages[0].image.imageBytes;
      }
      return null;
    } catch (error) {
      return null;
    }
  }
};

function bulk(t){
  pick(true, async files=>{
    const pairs=[], miss=[];
    for(let f of files){
      const k=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().toLowerCase();
      const i=t.words.findIndex(w=>w.en.toLowerCase()===k);
      if(i>=0){
        const b64 = await fileToBase64(f,800);
        pairs.push([i,b64]);
      } else {
        miss.push(f.name);
      }
    }
    await putImages(t,pairs);
    alert('Đã gắn ảnh thành công.'+(miss.length?' Không khớp tên: '+miss.join(', '):''));
    render();
  });
}

async function autoGen(t){
  const pairs=[];
  for(let i=0;i<t.words.length;i++){
    if(t.words[i].img)continue;
    try{
      const b=await GEMINI_HOOK.generateImage(t.words[i],t)||null;
      if(b)pairs.push([i,b]);
    }catch(e){}
  }
  await putImages(t,pairs);
  alert('Đã tạo xong ảnh tự động!');
  render();
}

function tools(t){
  return el('div',{class:'bar'},
    el('button',{class:'btn gold',onclick:()=>geminiPrompt(t)},'📋 Prompt cho Gemini'),
    el('button',{class:'btn',onclick:()=>bulk(t)},'📤 Tải nhiều ảnh'),
    GEMINI_HOOK.enabled?el('button',{class:'btn',onclick:()=>autoGen(t)},'🎨 Tạo ảnh tự động'):''
  );
}

function editSentences(w){
  let sList = [...(w.sentences || [])];
  const container = el('div', {style:'display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:4px'});
  
  const renderList = () => {
    container.replaceChildren();
    if(sList.length === 0) container.append(el('div',{style:'opacity:0.7;font-style:italic'},'Chưa có cấu trúc câu nào.'));
    sList.forEach((s, idx) => {
      const rowDiv = el('div',{style:'display:flex;gap:6px;align-items:center;background:var(--soft);padding:6px;border-radius:10px'},
        el('div',{style:'flex:1;display:flex;flex-direction:column;gap:4px'},
          el('input',{type:'text',value:s.en,placeholder:'Câu hỏi/trả lời (VD: A: What is this?)',style:'width:100%;font-size:14px',oninput:e=>sList[idx].en=e.target.value}),
          el('input',{type:'text',value:s.vi,placeholder:'Dịch tiếng Việt (VD: (Hỏi: Đây là cái gì?))',style:'width:100%;font-size:14px',oninput:e=>sList[idx].vi=e.target.value})
        ),
        el('button',{class:'btn red',style:'padding:8px 12px;min-height:auto',onclick:()=>{sList.splice(idx,1);renderList()}},'🗑️')
      );
      container.append(rowDiv);
    });
  };
  renderList();

  const addBtn = el('button',{class:'btn',style:'margin-top:8px',onclick:()=>{
    sList.push({en:'', vi:''});
    renderList();
  }},'➕ Thêm câu mới');

  const closeM = modal('💬 Chỉnh sửa Cấu trúc câu: ' + (w.en || w.name), container, addBtn, el('div',{class:'ctl',style:'margin-top:10px'}, el('button',{class:'btn',onclick:()=>{
    w.sentences = sList.filter(s=>s.en.trim()!=='' || s.vi.trim()!=='');
    saveTopics();
    closeM();
    render();
  }},'Lưu cấu trúc câu')));
}

function sentenceBox(o, small){
  const list = o.sentences || [];
  const box = el('div',{class:'sentence-box'},
    el('div',{class:'sentence-title'}, small ? '💬 Câu mẫu của từ' : '💬 Cấu trúc câu (Hỏi & Đáp)',
      el('div',{style:'display:flex;gap:6px'},
        list.length ? el('button',{class:'btn',style:'padding:2px 8px;font-size:12px;min-height:auto',onclick:()=>sayAll(list.map(x=>x.en))},'🔊 Đọc tất cả') : '',
        el('button',{class:'btn ghost',style:'padding:2px 8px;font-size:12px;min-height:auto',onclick:()=>editSentences(o)},'✏️ Sửa'))),
    ...(list.length ? list.map(x => el('div',{class:'sentence-item' + (/^\s*B\s*:/i.test(x.en) ? ' b' : '')},
        el('div',{class:'sentence-en',onclick:()=>say(x.en)}, '🔊 ' + x.en),
        x.vi ? el('div',{class:'sentence-vi'}, viText(x.vi)) : '')) : [el('div',{style:'opacity:.7;font-style:italic'},'Chưa có câu nào. Bấm ✏️ Sửa để thêm.')])
  );
  if(!small && (o.notes||[]).length) box.append(el('div',{class:'sentence-note'}, ...o.notes.map(n=>el('div',{},'🎵 ' + n))));
  return box;
}

function viewTopic(a){
  const t=topics.find(x=>x.id===st.topic);
  if(!t){st.topic=null;return home(a)}
  a.append(el('div',{class:'row'},
    el('button',{class:'btn ghost',onclick:()=>{st.topic=null;render()}},'⬅️ Quay lại'),
    el('b',{style:'cursor:pointer',onclick:()=>renameTopic(t),title:'Bấm để đổi tên'},(t.icon||'')+' '+t.name+' ✏️'),
    el('div',{style:'display:flex;gap:4px'},
      el('button',{class:'btn gold',style:'padding:6px 10px;min-height:auto',onclick:()=>renameTopic(t)},'✏️ Đổi tên'),
      el('button',{class:'btn red',style:'padding:6px 10px;min-height:auto',onclick:()=>{if(confirm('Xóa chủ đề này?')){topics=topics.filter(x=>x.id!==t.id);saveTopics();st.topic=null;render()}}},'🗑️')
    )
  ));
  const g=el('div',{class:'words-grid'});
  a.append(tools(t), sentenceBox(t));
  t.words.forEach((w,i)=>{
    const cardEl = el('div',{class:'card'},
      pic(w,e=>{say(w.en);pop(e.currentTarget)}),
      el('div',{class:'w'},w.en),
      el('div',{class:'vi'},w.vi),
      el('button',{class:'say',onclick:()=>say(w.en)},'🔊'),
      el('button',{class:'edit',style:'display:inline-flex;align-items:center;justify-content:center',title:'Đổi ảnh',onclick:()=>uplWordImg(t,i)},'📷'),
      el('button',{class:'edit',style:'display:inline-flex;align-items:center;justify-content:center;background:var(--gold);color:#4a1238',title:'Sửa câu',onclick:()=>editSentences(w)},'💬')
    );

    if((w.sentences||[]).length) cardEl.append(sentenceBox(w, true));

    g.append(cardEl);
  });

  const addWordBtn = el('button',{class:'btn',style:'width:100%;margin-top:16px',onclick:()=>{
    const enInp = el('input',{type:'text',placeholder:'Từ tiếng Anh (VD: Cat)',style:'width:100%;margin-bottom:6px'});
    const viInp = el('input',{type:'text',placeholder:'Nghĩa tiếng Việt (VD: Con mèo)',style:'width:100%;margin-bottom:10px'});
    const closeM = modal('➕ Thêm từ vựng', enInp, viInp, el('div',{class:'ctl'}, el('button',{class:'btn',onclick:()=>{
      const wordEn = enInp.value.trim();
      const wordVi = viInp.value.trim();
      if(wordEn){
        t.words.push({
          en: wordEn, 
          vi: wordVi, 
          emoji: '🌟', 
          sentences:[]
        });
        saveTopics();
        closeM();
        render();
      }
    }},'Thêm')));
  }},'➕ Thêm từ vựng mới');
  a.append(g, addWordBtn);
}

const ytid=u=>{const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m&&m[1]};
function songPage(a){
  const inp=el('input',{type:'text',placeholder:'Dán link YouTube vào đây',style:'flex:1;min-width:0'});
  const add=async()=>{
    const id=ytid(inp.value);
    if(!id){alert('Link YouTube chưa đúng.');return}
    const title=prompt('Đặt tên bài hát:','Bài hát '+(songs.length+1));
    if(title===null)return;
    songs.push({id:'s'+Date.now(), vid:id, title:title||'Bài hát'});
    saveSongs();
    inp.value='';
    render();
  };
  a.append(el('div',{class:'row'},inp,el('button',{class:'btn',onclick:add},'➕ Lưu')));
  if(!songs.length)a.append(el('div',{class:'msg'},'Chưa có bài hát nào.'));
  const g=el('div',{class:'sg'});
  songs.forEach(s=>{
    const hue=[...s.vid].reduce((x,c)=>x+c.charCodeAt(0),0)%360;
    const c=el('div',{class:'song',style:`background:hsl(${hue} 70% 48%)`},
      el('div',{class:'pl',onclick:()=>player(s)},'▶️'),
      el('div',{class:'t'},s.title),
      el('button',{onclick:()=>{const n=prompt('Tên mới:',s.title);if(n){s.title=n;saveSongs();render()}}},'✏️ Đổi tên'),
      el('button',{onclick:()=>{if(confirm('Xóa bài này?')){songs=songs.filter(x=>x.id!==s.id);saveSongs();render()}}},'🗑️')
    );
    g.append(c);
  });
  a.append(g);
}
function player(s){
  const o=$('#ovl');
  if(!o)return;
  o.replaceChildren(el('div',{class:'ov'},
    el('div',{class:'row'},el('b',{},'🎵 '+s.title),el('button',{class:'btn red',onclick:()=>{o.replaceChildren()}},'✖ Đóng')),
    el('iframe',{class:'frame',src:'https://www.youtube.com/embed/'+s.vid+'?rel=0&playsinline=1'+(location.protocol.startsWith('http')?'&origin='+encodeURIComponent(location.origin):''),referrerpolicy:'strict-origin-when-cross-origin',allow:'autoplay; encrypted-media; fullscreen; picture-in-picture',allowfullscreen:''}),
    el('p',{style:'text-align:center'},'Không xem được? (nếu mở file trực tiếp từ máy thì YouTube sẽ chặn) ',el('a',{href:'https://www.youtube.com/watch?v='+s.vid,target:'_blank',rel:'noopener'},'Mở trên YouTube'))
  ));
}

function reviewPage(a){
  const seen=new Set(),pool=[];
  topics.forEach(t=>t.words.forEach(w=>{const k=w.en.toLowerCase();if(!seen.has(k)){seen.add(k);pool.push(w)}}));
  a.append(el('div',{class:'msg'},
    el('p',{},'Kho từ vựng: '+pool.length+' từ (không trùng).'),
    el('button',{class:'btn gold',style:'font-size:20px',onclick:()=>{
      if(!pool.length){alert('Chưa có từ vựng nào.');return}
      const l=pool.map(w=>[Math.random(),w]).sort((x,y)=>x[0]-y[0]).slice(0,20).map(x=>x[1]);
      quiz(l);
    }},'⭐ Tạo bài ôn tập')
  ));
  if(pool.length&&pool.length<20)a.append(el('p',{class:'vi',style:'text-align:center'},'Hiện chưa đủ 20 từ, bài ôn sẽ dùng '+pool.length+' từ.'));
}

function quiz(list){
  const o=$('#ovl');if(!o)return;let i=0;const ans=[];
  const close=()=>o.replaceChildren();
  function draw(){
    if(i>=list.length){
      const n=ans.filter(Boolean).length;
      cfg.stars=(cfg.stars||0)+n;save();stars();confetti(30);beep(1047,.3);
      o.replaceChildren(el('div',{class:'ov'},
        el('div',{class:'big'},
          el('div',{style:'font-size:90px'},n>=list.length*.7?'🏆':'🌟'),
          el('div',{class:'w'},'Đúng '+n+' / '+list.length),
          el('button',{class:'btn gold',onclick:close},'Xong')
        )
      ));
      return;
    }
    const w=list[i];
    o.replaceChildren(el('div',{class:'ov'},
      el('div',{class:'row'},el('b',{},'Câu '+(i+1)+' / '+list.length),el('button',{class:'btn red',onclick:close},'✖')),
      el('div',{class:'big'},pic(w),el('div',{class:'w'},w.en),el('button',{class:'say',style:'width:64px;height:64px;font-size:32px',onclick:()=>say(w.en)},'🔊')),
      el('div',{class:'ctl'},
        el('button',{class:'btn ghost',onclick:()=>{ans[i]=false;next()}},'❌ Sai'),
        el('button',{class:'btn',style:'background:#2e9d4f',onclick:()=>{ans[i]=true;cheer();next()}},'✅ Đúng')
      ),
      el('div',{class:'ctl'},
        el('button',{class:'btn ghost',onclick:()=>{if(i>0){i--;draw()}}},'⬅️ Back'),
        el('button',{class:'btn ghost',onclick:next},'Next ➡️')
      )
    ));
  }
  function next(){i++;draw()}
  draw();
}

(function(){
  const SVG=`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Bé Dơi Tím">
<g class="wing-l"><path d="M34 62 Q4 34 8 82 Q16 72 24 86 Q26 74 36 78 Z" fill="#4b1d7a"/></g>

<circle cx="49" cy="61" r="2" fill="#fff"/><circle cx="75" cy="61" r="2" fill="#fff"/></g>
<circle cx="32" cy="78" r="6" fill="#ff8fc7" opacity=".8"/><circle cx="88" cy="78" r="6" fill="#ff8fc7" opacity=".8"/>
<path d="M52 80 Q60 88 68 80" fill="none" stroke="#2d1546" stroke-width="3" stroke-linecap="round"/>
<path d="M55 83 L57 90 L60 84 Z" fill="#fff"/>
<g transform="translate(88 20)"><path d="M0 0 L-14 -8 L-14 8 Z" fill="#ff5fae"/><path d="M0 0 L14 -8 L14 8 Z" fill="#ff5fae"/><circle r="5" fill="#ff8fc7"/></g>
</svg>`;
  const KEY='mascot_img', LINES=["Hello!","Good job!","Let's learn!","Wow!","I love English!"];
  let box,timer;
  const get=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
  function build(){
    if(box)box.remove();
    box=document.createElement('div');box.className='mascot';
    const inn=document.createElement('div');inn.className='m-in';
    const img=get();
    if(img){const i=document.createElement('img');i.className='m-img';i.src=img;i.alt='Linh vật';inn.append(i)}else inn.innerHTML=SVG;
    const bub=document.createElement('div');bub.className='bubble';
    const btn=document.createElement('button');btn.className='mbtn';btn.title=img?'Đổi / xóa ảnh linh vật':'Dùng ảnh linh vật của bạn';btn.textContent='🖼️';
    btn.onclick=e=>{e.stopPropagation();pick()};
    box.append(bub,inn,btn);
    box.onclick=()=>{
      const t=LINES[Math.floor(Math.random()*LINES.length)];
      bub.textContent=t;box.classList.remove('hop');void box.offsetWidth;box.classList.add('hop','talk');
      try{say(t)}catch(e){}
      clearTimeout(timer);timer=setTimeout(()=>box.classList.remove('talk','hop'),1800);
    };
    document.body.append(box);
  }
  function pick(){
    if(get()&&confirm('Xóa ảnh linh vật riêng và quay về Bé Dơi Tím?\nBấm Hủy để chọn ảnh khác.')){try{localStorage.removeItem(KEY)}catch(e){};build();return}
    const f=document.createElement('input');f.type='file';f.accept='image/*';
    f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();
      r.onload=()=>{const im=new Image();im.onload=()=>{
        const S=240,k=Math.min(1,S/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        try{localStorage.setItem(KEY,c.toDataURL('image/png'))}catch(e){alert('Không lưu được ảnh (bộ nhớ trình duyệt đầy).')}
        build()};im.src=r.result};r.readAsDataURL(file)};
    f.click();
  }
  window.rebuildMascot=build;
  build();
})();
