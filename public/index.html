<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Bé học tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg1:#c79cf2;--bg2:#fde8f6;--card:#fff;--ink:#2d1546;--pri:#7b2cbf;--red:#e53935;--gold:#ff8fc7;--soft:#f4e6fc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b1a5a;--bg2:#170a26;--card:#2a1744;--ink:#f6e9ff;--soft:#3c2260}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2)) fixed}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cloud{position:absolute;font-size:48px;opacity:.75;animation:drift linear infinite}
.star{position:absolute;font-size:22px;animation:tw 2.5s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
@keyframes tw{50%{opacity:.2;transform:scale(.7)}}
@keyframes bob{50%{transform:translateY(-8px)}}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:12px 14px 130px}
h1{margin:6px 0;font-size:28px;text-align:center}
h1 span{display:inline-block}
#bell{font-size:40px;cursor:pointer;animation:bob 2s ease-in-out infinite;transform-origin:top center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -4px 0 #0002}
button{font:inherit;color:inherit;cursor:pointer}
nav button{flex:1;max-width:220px;min-height:76px;border:0;border-radius:24px;background:var(--soft);font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s}
nav button .ni{font-size:34px;line-height:1}
nav button.on{background:var(--gold);color:#4a1238;transform:translateY(-6px);box-shadow:0 4px 0 #0003}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;font-size:14px}
select,input[type=text]{font:inherit;padding:8px 10px;border-radius:14px;border:2px solid var(--pri);background:var(--card);color:var(--ink)}
.btn{border:0;border-radius:20px;padding:10px 16px;background:var(--pri);color:#fff;font-weight:700;box-shadow:0 3px 0 #0004}
.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:#4a1238}.btn.ghost{background:var(--card);color:var(--ink)}

/* Grid chủ đề */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--card);color:var(--ink);border-radius:26px;padding:12px 8px;text-align:center;border:3px solid var(--pri);box-shadow:0 5px 0 #0003;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;transition:transform .1s;position:relative}
.tile:active{transform:scale(.93)}
.tile-thumb{width:100%;aspect-ratio:1.2;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:clamp(36px,9vw,56px);overflow:hidden}
.tile-thumb img{width:100%;height:100%;object-fit:cover}
.tile .nm{font-weight:800;font-size:clamp(14px,3.6vw,18px);word-break:break-word;color:var(--ink);margin-top:2px}
.tile.add{border-style:dashed;background:transparent;justify-content:center}

/* Card từ vựng */
.words-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:768px){.words-grid{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--card);border-radius:28px;padding:20px;text-align:center;box-shadow:0 6px 0 #0003;position:relative}
.pic{width:100%;aspect-ratio:1.1;border-radius:22px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:clamp(100px,25vw,160px);overflow:hidden;cursor:pointer}
.pic img{width:100%;height:100%;object-fit:cover}
.w{font-size:36px;font-weight:800;margin:12px 0 2px}
.vi{font-size:20px;opacity:.8;font-weight:600}

.sentence-box{margin-top:14px;background:var(--soft);border-radius:18px;padding:14px;text-align:left;border:2px dashed var(--pri)}
.sentence-title{font-weight:800;font-size:16px;color:var(--pri);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.sentence-item{margin-bottom:10px;font-size:15px;display:flex;flex-direction:column;gap:3px;background:var(--card);padding:8px 12px;border-radius:12px;box-shadow:0 2px 4px #0001}
.sentence-en{font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.sentence-vi{font-size:14px;color:#555;font-style:italic}
.sentence-item.b{margin-left:18px;border-left:4px solid var(--pri)}
.guide details{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;text-align:left}
.guide summary{font-weight:800;font-size:17px;cursor:pointer}
.guide li{margin:6px 0;line-height:1.45}.guide ol,.guide ul{padding-left:22px}
.guide code{background:var(--soft);border-radius:6px;padding:1px 6px;font-size:13px}
.guide pre{background:var(--soft);border-radius:10px;padding:10px;font-size:13px;overflow-x:auto;white-space:pre}
.guide table{border-collapse:collapse;width:100%;font-size:13px}.guide td,.guide th{border:1px solid #0002;padding:6px;vertical-align:top}
.guide .tip{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.sentence-note{margin-top:10px;font-size:14px;opacity:.85}

.say{border:0;background:var(--gold);border-radius:50%;width:72px;height:72px;font-size:36px;margin-top:10px;box-shadow:0 4px 0 #0003}
.say:active{transform:scale(.9)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.msg{text-align:center;padding:16px;background:var(--card);border-radius:18px}
.ov{position:fixed;inset:0;z-index:10;background:linear-gradient(var(--bg1),var(--bg2));display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));gap:10px;overflow-y:auto}
.ov .big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:8px;text-align:center}
.ov .big .pic{width:min(85vw,60vh);cursor:default;font-size:min(45vw,35vh)}
.ov .big .w{font-size:44px}
.ctl{display:flex;gap:10px;justify-content:center}
.ctl .btn{flex:1;max-width:160px;font-size:18px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.song{border-radius:22px;color:#fff;padding:14px 10px;text-align:center;box-shadow:0 4px 0 #0003}
.song .pl{font-size:44px;cursor:pointer}
.song .t{font-weight:800;margin:4px 0;word-break:break-word}
.song button{border:0;background:#fff4;border-radius:12px;padding:4px 8px;margin:2px;color:#fff}
.frame{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000}
a{color:var(--pri);font-weight:700}
.stars{background:var(--gold);color:#4a1238;border-radius:20px;padding:2px 12px;font-size:22px;vertical-align:middle;box-shadow:0 3px 0 #0003}
.sky::after{content:'';position:absolute;left:-10%;right:-10%;bottom:0;height:20vh;background:radial-gradient(ellipse at 28% 100%,#7bd88f 55%,transparent 56%),radial-gradient(ellipse at 75% 100%,#5cc377 50%,transparent 51%)}
.bal{position:absolute;bottom:-80px;font-size:48px;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(8deg)}}
.pop{animation:pop .45s}
@keyframes pop{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}}
.ring{animation:ring .8s!important}
@keyframes ring{20%{transform:rotate(25deg)}40%{transform:rotate(-20deg)}60%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
.cf{position:fixed;top:-40px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.edit{border:0;background:var(--soft);border-radius:50%;width:44px;height:44px;font-size:22px;margin:10px 0 0 10px}
.topic-edit{position:absolute;top:6px;right:6px;background:var(--card);border:1px solid var(--pri);border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;z-index:2;box-shadow:0 2px 4px #0002}
.ctl .btn{min-height:64px}
.btn{min-height:48px}
.mascot{position:fixed;right:6px;bottom:calc(112px + env(safe-area-inset-bottom,0px));width:84px;z-index:4;cursor:pointer;animation:mfloat 3s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.mascot .m-in{width:100%}.mascot svg,.mascot .m-img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 0 #0003)}
.mascot .m-img{border-radius:50%;aspect-ratio:1;object-fit:cover;animation:sway 2.4s ease-in-out infinite}
.mascot.hop .m-in{animation:mhop .6s}
.mascot .bubble{position:absolute;right:50%;bottom:100%;margin-bottom:4px;background:#fff;color:#4a1238;border-radius:14px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 #0003;opacity:0;transform:translateX(30%) scale(.8);transition:.2s;pointer-events:none}
.mascot.talk .bubble{opacity:1;transform:translateX(30%) scale(1)}
.mascot .mbtn{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border:0;border-radius:50%;background:var(--card);box-shadow:0 2px 0 #0003;font-size:13px;padding:0;opacity:.85}
.wing-l{transform-origin:34px 66px;animation:flapL .5s ease-in-out infinite alternate}
.wing-r{transform-origin:86px 66px;animation:flapR .5s ease-in-out infinite alternate}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes flapL{from{transform:rotate(10deg)}to{transform:rotate(-16deg)}}
@keyframes flapR{from{transform:rotate(-10deg)}to{transform:rotate(16deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes mfloat{50%{transform:translateY(-10px)}}
@keyframes mhop{30%{transform:translateY(-26px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes sway{50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.mascot,.mascot *{animation:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<main>
  <h1><span id="bell">🔔</span> Bé học tiếng Anh <span class="stars" id="stars">⭐ 0</span></h1>
  <nav id="nav"></nav>
  <div class="bar" id="vbar"></div>
  <div id="app"></div>
</main>
<div id="ovl"></div>

<script>
const $=s=>document.querySelector(s);
function el(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c==null?'':c)));return e}

try{
  const s=$('#sky');
  for(let i=0;i<5;i++){const c=el('div',{class:'cloud'},['🦇','💜','🖤','🎀','✨'][i%5]);c.style.top=(5+i*17)+'%';c.style.animationDuration=(40+i*12)+'s';c.style.animationDelay=(-i*9)+'s';s.append(c)}
  for(let i=0;i<10;i++){const c=el('div',{class:'star'},i%2?'⭐':'✨');c.style.left=Math.random()*95+'%';c.style.top=Math.random()*90+'%';c.style.animationDelay=Math.random()*2+'s';s.append(c)}
  ['🎈','🪁','🎈'].forEach((b,i)=>{const d=el('div',{class:'bal'},b);d.style.left=(15+i*32)+'%';d.style.animationDuration=(28+i*9)+'s';d.style.animationDelay=(-i*11)+'s';s.append(d)});
}catch(e){}

window.topics=[]; window.songs=[];
let st={page:'home',topic:null,busy:''};
window.cfg={voice:'',rate:'slow',stars:0};
try{Object.assign(window.cfg,JSON.parse(localStorage.getItem('cfg')||'{}'))}catch(e){}

const defaultTopics = [
  {id:'t1', name:'Transportation (Giao thông)', icon:'🚗', words:[
    {
      en:'Bus', vi:'Xe buýt', emoji:'🚌',
      sentences:[
        {en:"A: What's this?", vi:"(Hỏi: Đây là cái gì?)"},
        {en:"B: This is a bus.", vi:"(Đáp: Đây là xe buýt.)"},
        {en:"A: Where do you see a bus?", vi:"(Hỏi: Bạn nhìn thấy xe buýt ở đâu?)"},
        {en:"B: I see a bus on the road.", vi:"(Đáp: Tôi nhìn thấy xe buýt trên đường.)"}
      ]
    },
    {
      en:'Motorbike', vi:'Xe máy', emoji:'🛵',
      sentences:[
        {en:"A: How do you go to school?", vi:"(Hỏi: Bạn đến trường bằng phương tiện gì?)"},
        {en:"B: I go by motorbike.", vi:"(Đáp: Tôi đi đến trường bằng xe máy.)"}
      ]
    }
  ]}
];

try{
  const saved = localStorage.getItem('topics');
  if(saved) {
    const parsed = JSON.parse(saved);
    window.topics = (Array.isArray(parsed) && parsed.length > 0) ? parsed : defaultTopics;
  } else {
    window.topics = defaultTopics;
  }
  window.songs = JSON.parse(localStorage.getItem('songs')) || [];
}catch(e){
  window.topics = defaultTopics; 
  window.songs = [];
}

let voices=[];
function loadV(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));drawBar()}catch(e){}}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadV;loadV()}
const clean=t=>String(t||'').replace(/^\s*[AB]\s*:\s*/i,'').replace(/\s*\/\s*/g,' or ');
function mk(t){const u=new SpeechSynthesisUtterance(clean(t));u.lang='en-US';const v=voices.find(v=>v.name===window.cfg.voice);if(v)u.voice=v;u.rate=window.cfg.rate==='slow'?.6:.95;return u}
function say(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.speak(mk(t))}
function sayAll(list){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();list.forEach(t=>speechSynthesis.speak(mk(t)))}
const viText=v=>{v=String(v||'').trim();return v&&!/^\(/.test(v)?'('+v+')':v};
function drawBar(){const b=$('#vbar');if(!b)return;b.replaceChildren();
const sv=el('select',{onchange:e=>{window.cfg.voice=e.target.value;save();say('Hello')}},el('option',{value:''},'🗣️ Giọng mặc định'),...voices.map(v=>el('option',{value:v.name},v.name+' ('+v.lang+')')));sv.value=window.cfg.voice;
const sr=el('select',{onchange:e=>{window.cfg.rate=e.target.value;save()}},el('option',{value:'slow'},'🐢 Đọc chậm'),el('option',{value:'normal'},'🐇 Đọc bình thường'));sr.value=window.cfg.rate;
b.append(sv,sr)}

function fileToBase64(file, maxDim) {
  return new Promise((resolve, reject) => {
    createImageBitmap(file).then(bm => {
      const k = Math.min(1, maxDim / Math.max(bm.width, bm.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bm.width * k);
      c.height = Math.round(bm.height * k);
      c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.65));
    }).catch(reject);
  });
}

function pick(multi,cb,acc){const i=el('input',{type:'file',accept:acc||'image/*'});if(multi)i.multiple=true;i.onchange=()=>{if(i.files.length)cb([...i.files])};i.click()}
const pic=(w,onclick)=>{const p=el('div',{class:'pic',onclick},w.img?el('img',{src:w.img,alt:w.en}):(w.emoji||'🖼️'));return p};

function guidePage(a){
  const d=el('div',{class:'guide'});
  d.innerHTML=`
<div class="msg" style="margin-bottom:10px"><b>📘 Hướng dẫn đưa app lên mạng</b><br>Dành cho bố mẹ. Làm 1 lần, sau đó bé mở app bằng đường link trên mọi thiết bị.</div>
<details open><summary>0️⃣ Đồng bộ tự động giữa nhiều máy</summary>
<div class="tip">🎉 App của bạn đã kết nối thành công với <b>Cloud Firestore</b>. Mọi thay đổi dữ liệu sẽ tự động đồng bộ tức thì trên tất cả các máy!</div>
</details>`;
  a.append(d);
}

function nav(){const n=$('#nav');if(!n)return;n.replaceChildren();[['home','🏠','Chủ đề'],['song','🎵','Bài hát'],['review','⭐','Ôn tập'],['guide','📘','Hướng dẫn']].forEach(([k,i,l])=>n.append(el('button',{class:st.page===k?'on':'',onclick:()=>{st.page=k;st.topic=null;window.render()}},el('span',{class:'ni'},i),l)));stars()}
window.render=function(){nav();const a=$('#app');if(!a)return;a.replaceChildren();
if(st.page==='home')st.topic?viewTopic(a):home(a);else if(st.page==='song')songPage(a);else if(st.page==='guide')guidePage(a);else reviewPage(a)}

window.stars=function(){const s=$('#stars');if(s)s.textContent='⭐ '+(window.cfg.stars||0)}
let ac;function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function jingle(){beep(1320,.5);setTimeout(()=>beep(1760,.6),150);const b=$('#bell');if(b){b.classList.remove('ring');void b.offsetWidth;b.classList.add('ring')}}
function pop(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function confetti(n){const f=['⭐','🎈','✨','🎉','🔔'];for(let i=0;i<n;i++){const s=el('div',{class:'cf'},f[i%5]);s.style.left=Math.random()*100+'%';s.style.animationDuration=(1.5+Math.random()*1.5)+'s';s.style.fontSize=(20+Math.random()*24)+'px';document.body.append(s);setTimeout(()=>s.remove(),3200)}}
function cheer(){beep(880,.2);setTimeout(()=>beep(1175,.3),120);confetti(8)}

function uplWordImg(t,i){pick(false,async([f])=>{try{const b64=await fileToBase64(f,480);t.words[i].img=b64;saveTopics();window.render()}catch(e){alert('Tải ảnh lỗi, thử lại.')}})}
function uplTopicImg(t){pick(false,async([f])=>{try{const b64=await fileToBase64(f,480);t.coverImg=b64;saveTopics();window.render()}catch(e){alert('Tải ảnh lỗi, thử lại.')}})}

function renameTopic(t){
  const inp=el('input',{type:'text',value:t.name,style:'width:100%;margin-bottom:10px'});
  const close=modal('✏️ Đổi tên chủ đề', inp, el('div',{class:'ctl'},el('button',{class:'btn',onclick:()=>{
    const newName=inp.value.trim();
    if(newName){t.name=newName;saveTopics();close();window.render()}
  }},'Lưu tên')));
}

const bellEl=$('#bell');if(bellEl)bellEl.addEventListener('click',jingle);

const MASCOT_KEY='mascot_img';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};

function collectBackup(){
  const {stars:_s, ...settings} = window.cfg;
  return {
    app: 'BeHocTiengAnh', version: 2, exportDate: new Date().toISOString(),
    stars: Number(window.cfg.stars)||0,
    topics: window.topics, songs: window.songs, settings: settings,
    mascot: lsGet(MASCOT_KEY)
  };
}

function exportFullBackup() {
  const data = collectBackup();
  const jsonStr = JSON.stringify(data);
  const blob = new Blob([jsonStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = 'BeHocTiengAnh_FullBackup_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function importFullBackup() {
  pick(false, ([f]) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data.topics)) window.topics = data.topics;
        if (Array.isArray(data.songs)) window.songs = data.songs;
        if (data.settings) Object.assign(window.cfg, data.settings);
        if (data.stars !== undefined) window.cfg.stars = Number(data.stars) || 0;
        saveTopics(); saveSongs(); save();
        window.render();
        alert('Đã khôi phục thành công!');
      } catch (err) { alert('Lỗi file backup: ' + err.message); }
    };
    reader.readAsText(f);
  }, 'application/json');
}

function home(a){
  const topBar = el('div',{class:'row',style:'margin-bottom:14px;gap:8px;flex-wrap:wrap'},

const GEMINI_JSON_PROMPT = `Bạn là trợ lý chuyển đề cương tiếng Anh mầm non thành JSON. Tôi gửi kèm ảnh đề cương. Hãy đọc kỹ ảnh và chỉ trả về MỘT khối JSON (không giải thích thêm), đúng cấu trúc:
{"weeks":[{"week":"Tuần 1","title":"Land transportation","words":[{"en":"Road","vi":"Con đường","emoji":"🛣️"}],"sentences":[{"en":"A: What's this?","vi":"(Hỏi: Đây là cái gì?)"},{"en":"B: This is a taxi.","vi":"(Đáp: Đây là xe taxi.)"}],"notes":["Song: ..."]}]}`;
const copyText = txt => { try{ navigator.clipboard.writeText(txt).then(()=>alert('Đã sao chép'),()=>alert('Không sao chép được')) }catch(e){ alert('Not copied') } };

function importJsonModal(){
  const ta = el('textarea',{placeholder:'Dán đoạn JSON cấu trúc chủ đề vào đây...',style:'width:100%;height:220px;font:inherit;border-radius:14px;padding:10px;border:2px solid var(--pri);background:var(--card);color:var(--ink)'});
  const close = modal('📥 Nhập JSON Chủ đề', ta, el('div',{class:'ctl'}, el('button',{class:'btn gold',onclick:()=>copyText(GEMINI_JSON_PROMPT)},'📋 Chép prompt cho Gemini'), el('button',{class:'btn',onclick:()=>{
    try{
      const data = JSON.parse(ta.value);
      let addedCount = 0;
      const weeksArr = Array.isArray(data) ? data : (data.weeks || data.topics || []);
      const cleanS = arr => (Array.isArray(arr)?arr:[]).filter(x=>x&&(x.en||x.vi)).map(x=>({en:String(x.en||''),vi:String(x.vi||'')}));
      weeksArr.forEach((w, idx)=>{
        const tName = w.week ? (w.week + (w.title ? ': ' + w.title : '')) : (w.name || w.title || ('Chủ đề ' + (window.topics.length + 1)));
        const wordsArr = (w.words || []).map(x => ({en: x.en || '', vi: x.vi || '', emoji: x.emoji || '🌟', sentences: cleanS(x.sentences)}));
        const sents = cleanS(w.sentences);
        const notes = Array.isArray(w.notes) ? w.notes.map(String) : [];
        if(wordsArr.length > 0 || sents.length > 0 || notes.length > 0){
          window.topics.push({id: 't' + Date.now() + '_' + idx, name: tName, icon: w.icon || '🚀', words: wordsArr, sentences: sents, notes: notes});
          addedCount++;
        }
      });
      if(addedCount > 0){
        saveTopics();
        alert('Đã nhập thành công ' + addedCount + ' chủ đề mới!');
        close();
        window.render();
      }
    }catch(err){ alert('Lỗi định dạng JSON: ' + err.message); }
  }},'Xác nhận Nhập')));
}

function editSentences(w){
  let sList = [...(w.sentences || [])];
  const container = el('div', {style:'display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:4px'});
  const renderList = () => {
    container.replaceChildren();
    if(sList.length === 0) container.append(el('div',{style:'opacity:0.7;font-style:italic'},'Chưa có cấu trúc câu nào.'));
    sList.forEach((s, idx) => {
      const rowDiv = el('div',{style:'display:flex;gap:6px;align-items:center;background:var(--soft);padding:6px;border-radius:10px'},
        el('div',{style:'flex:1;display:flex;flex-direction:column;gap:4px'},
          el('input',{type:'text',value:s.en,placeholder:'Câu hỏi/trả lời',style:'width:100%;font-size:14px',oninput:e=>sList[idx].en=e.target.value}),
          el('input',{type:'text',value:s.vi,placeholder:'Dịch tiếng Việt',style:'width:100%;font-size:14px',oninput:e=>sList[idx].vi=e.target.value})
        ),
        el('button',{class:'btn red',style:'padding:8px 12px;min-height:auto',onclick:()=>{sList.splice(idx,1);renderList()}},'🗑️')
      );
      container.append(rowDiv);
    });
  };
  renderList();

  const addBtn = el('button',{class:'btn',style:'margin-top:8px',onclick:()=>{ sList.push({en:'', vi:''}); renderList(); }},'➕ Thêm câu mới');

  const closeM = modal('💬 Chỉnh sửa Cấu trúc câu: ' + (w.en || w.name), container, addBtn, el('div',{class:'ctl',style:'margin-top:10px'}, el('button',{class:'btn',onclick:()=>{
    w.sentences = sList.filter(s=>s.en.trim()!=='' || s.vi.trim()!=='');
    saveTopics();
    closeM();
    window.render();
  }},'Lưu cấu trúc câu')));
}

  const box = el('div',{class:'sentence-box'},
    el('div',{class:'sentence-title'}, small ? '💬 Câu mẫu của từ' : '💬 Cấu trúc câu (Hỏi & Đáp)',
      el('div',{style:'display:flex;gap:6px'},
        list.length ? el('button',{class:'btn',style:'padding:2px 8px;font-size:12px;min-height:auto',onclick:()=>sayAll(list.map(x=>x.en))},'🔊 Đọc tất cả') : '',
        el('button',{class:'btn ghost',style:'padding:2px 8px;font-size:12px;min-height:auto',onclick:()=>editSentences(o)},'✏️ Sửa'))),
    ...(list.length ? list.map(x => el('div',{class:'sentence-item' + (/^\s*B\s*:/i.test(x.en) ? ' b' : '')},

function bulkImgUpload(t){
  const key=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const fileKey=n=>key(String(n).replace(/\.[^.]+$/,'').replace(/\s*\(\d+\)\s*$/,''));
  pick(true, async files=>{
    let ok=0; const miss=[], fail=[];
    for(const f of files){
      const k=fileKey(f.name);
      const idx=t.words.findIndex(w=>key(w.en)===k);
      if(idx<0){miss.push(f.name);continue}
      try{ t.words[idx].img=await fileToBase64(f,400); ok++ }catch(e){ fail.push(f.name) }
    }
    if(ok>0){ saveTopics(); window.render() }
    let msg='✅ Đã khớp '+ok+'/'+files.length+' ảnh.';
    if(miss.length) msg+='\n\n❓ Không có từ vựng trùng tên:\n'+miss.slice(0,10).join('\n')+(miss.length>10?'\n...':'');
    if(fail.length) msg+='\n\n⚠️ Đọc lỗi:\n'+fail.slice(0,10).join('\n');
    alert(msg);
  });
}

const ytid=u=>{const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m&&m[1]};
function songPage(a){
  const inp=el('input',{type:'text',placeholder:'Dán link YouTube vào đây',style:'flex:1;min-width:0'});
  const add=async()=>{
    const id=ytid(inp.value);
    if(!id){alert('Link YouTube chưa đúng.');return}
    const title=prompt('Đặt tên bài hát:','Bài hát '+(window.songs.length+1));
    if(title===null)return;
    window.songs.push({id:'s'+Date.now(), vid:id, title:title||'Bài hát'});
    saveSongs();
    inp.value='';
    window.render();
  };
  a.append(el('div',{class:'row'},inp,el('button',{class:'btn',onclick:add},'➕ Lưu')));
  if(!window.songs.length)a.append(el('div',{class:'msg'},'Chưa có bài hát nào.'));
  const g=el('div',{class:'sg'});
  window.songs.forEach(s=>{
    const hue=[...s.vid].reduce((x,c)=>x+c.charCodeAt(0),0)%360;
    const c=el('div',{class:'song',style:`background:hsl(${hue} 70% 48%)`},
      el('div',{class:'pl',onclick:()=>player(s)},'▶️'),
      el('div',{class:'t'},s.title),
      el('button',{onclick:()=>{const n=prompt('Tên mới:',s.title);if(n){s.title=n;saveSongs();window.render()}}},'✏️ Đổi tên'),
      el('button',{onclick:()=>{if(confirm('Xóa bài này?')){window.songs=window.songs.filter(x=>x.id!==s.id);saveSongs();window.render()}}},'🗑️')
    );
    g.append(c);
  });
  a.append(g);
}
function player(s){
  const o=$('#ovl');
  if(!o)return;
  o.replaceChildren(el('div',{class:'ov'},
    el('div',{class:'row'},el('b',{},'🎵 '+s.title),el('button',{class:'btn red',onclick:()=>{o.replaceChildren()}},'✖ Đóng')),
    el('iframe',{class:'frame',src:'https://www.youtube.com/embed/'+s.vid+'?rel=0&playsinline=1'+(location.protocol.startsWith('http')?'&origin='+encodeURIComponent(location.origin):''),referrerpolicy:'strict-origin-when-cross-origin',allow:'autoplay; encrypted-media; fullscreen; picture-in-picture',allowfullscreen:''}),
    el('p',{style:'text-align:center'},'Không xem được? ',el('a',{href:'https://www.youtube.com/watch?v='+s.vid,target:'_blank',rel:'noopener'},'Mở trên YouTube'))

function reviewPage(a){
  const seen=new Set(),pool=[];
  window.topics.forEach(t=>t.words.forEach(w=>{const k=w.en.toLowerCase();if(!seen.has(k)){seen.add(k);pool.push(w)}}));
  a.append(el('div',{class:'msg'},
    el('p',{},'Kho từ vựng: '+pool.length+' từ (không trùng).'),
    el('button',{class:'btn gold',style:'font-size:20px',onclick:()=>{
      if(!pool.length){alert('Chưa có từ vựng nào.');return}
      const l=pool.map(w=>[Math.random(),w]).sort((x,y)=>x[0]-y[0]).slice(0,20).map(x=>x[1]);
      quiz(l);
    }},'⭐ Tạo bài ôn tập')
  ));
}

function quiz(list){
  const o=$('#ovl');if(!o)return;let i=0;const ans=[];
  const close=()=>o.replaceChildren();
  function draw(){
    if(i>=list.length){
      const n=ans.filter(Boolean).length;
      window.cfg.stars=(window.cfg.stars||0)+n;save();window.stars();confetti(30);beep(1047,.3);
      o.replaceChildren(el('div',{class:'ov'},
        el('div',{class:'big'},
          el('div',{style:'font-size:90px'},n>=list.length*.7?'🏆':'🌟'),
          el('div',{class:'w'},'Đúng '+n+' / '+list.length),
          el('button',{class:'btn gold',onclick:close},'Xong')
        )
      ));
      return;
    }
    const w=list[i];
    o.replaceChildren(el('div',{class:'ov'},
      el('div',{class:'row'},el('b',{},'Câu '+(i+1)+' / '+list.length),el('button',{class:'btn red',onclick:close},'✖')),
      el('div',{class:'big'},pic(w),el('div',{class:'w'},w.en),el('button',{class:'say',style:'width:64px;height:64px;font-size:32px',onclick:()=>say(w.en)},'🔊')),
      el('div',{class:'ctl'},
        el('button',{class:'btn ghost',onclick:()=>{ans[i]=false;next()}},'❌ Sai'),
        el('button',{class:'btn',style:'background:#2e9d4f',onclick:()=>{ans[i]=true;cheer();next()}},'✅ Đúng')
      ),
      el('div',{class:'ctl'},
        el('button',{class:'btn ghost',onclick:()=>{if(i>0){i--;draw()}}},'⬅️ Back'),
        el('button',{class:'btn ghost',onclick:next},'Next ➡️')
      )
    ));
  }
  function next(){i++;draw()}
  draw();
}

<!-- Firestore Cloud Sync Engine (v2: mỗi chủ đề 1 document, có báo lỗi hiển thị) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD0Oqk_UFWZ2OKX6LMQQnAysPologoOVE0",
    authDomain: "app-hoc-tieng-anh-b.firebaseapp.com",
    projectId: "app-hoc-tieng-anh-b",
    storageBucket: "app-hoc-tieng-anh-b.firebasestorage.app",
    messagingSenderId: "515402968386",
    appId: "1:515402968386:web:f084580b5ac64118f92cdb",
    measurementId: "G-TKSEBV4YY4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const col = collection(db, "appData");          // giữ nguyên collection cũ
  const songsRef = doc(db, "appData", "songs");
  const cfgRef = doc(db, "appData", "cfg");
  const legacyId = "main";                         // document cũ (v1), chỉ đọc để chuyển dữ liệu

  // Có dữ liệu thật ở máy này trước khi tải app không? (để quyết định có đẩy lên cloud hay không)
  const hadLocalTopics = !!localStorage.getItem('topics');
  const hadLocalSongs = !!localStorage.getItem('songs');

  let ready = false;                               // true sau khi nhận snapshot đầu tiên từ cloud
  const topicCache = new Map();                    // id -> JSON đã có trên cloud (để chỉ ghi phần thay đổi)
  let songsCache = null;

  // ---- Badge trạng thái đồng bộ (hiển thị lỗi, không còn lỗi âm thầm) ----
  const badge = document.createElement('div');
  badge.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:9999;padding:4px 10px;border-radius:14px;font:600 12px sans-serif;background:#fff;box-shadow:0 2px 6px #0004;max-width:70vw';
  document.body.appendChild(badge);
  let errShown = false;
  function setStatus(kind, msg) {
    badge.textContent = (kind === 'ok' ? '☁️ ' : kind === 'wait' ? '⏳ ' : '⚠️ ') + msg;
    badge.style.color = kind === 'err' ? '#b00020' : '#333';
  }
  function fail(where, err) {
    console.error('Firestore ' + where + ':', err);
    const code = (err && err.code) || (err && err.message) || 'unknown';
    setStatus('err', 'Lỗi đồng bộ (' + code + ')');
    if (!errShown) {
      errShown = true;
      alert('⚠️ Không đồng bộ được lên cloud.\nMã lỗi: ' + code +
        '\n• permission-denied → kiểm tra Firestore Rules\n• invalid-argument → dữ liệu (ảnh) quá lớn\n• unavailable → mất mạng');
    }
  }
  setStatus('wait', 'Đang kết nối...');

  const sizeOf = o => new Blob([JSON.stringify(o)]).size;

  // ---- Ghi lên cloud ----
  function pushTopics() {
    if (!ready) return;                            // chưa biết cloud có gì → không ghi đè
    const list = window.topics || [];
    const alive = new Set();
    list.forEach((t, i) => {
      alive.add(t.id);
      const obj = Object.assign({}, t, { order: i });
      const json = JSON.stringify(obj);
      if (topicCache.get(t.id) === json) return;   // không đổi → bỏ qua
      if (json.length > 950000) {                  // giới hạn Firestore ~1MiB / document
        fail('topic quá lớn', { code: 'topic "' + t.name + '" quá 1MB, hãy bớt ảnh' });
        return;
      }
      topicCache.set(t.id, json);
      setStatus('wait', 'Đang lưu...');
      setDoc(doc(db, "appData", "topic_" + t.id), obj)
        .then(() => setStatus('ok', 'Đã đồng bộ'))
        .catch(err => { topicCache.delete(t.id); fail('ghi chủ đề', err); });
    });
    [...topicCache.keys()].forEach(id => {
      if (!alive.has(id)) {
        topicCache.delete(id);
        deleteDoc(doc(db, "appData", "topic_" + id)).catch(err => fail('xóa chủ đề', err));
      }
    });
  }

  function pushSongs() {
    if (!ready) return;
    const json = JSON.stringify(window.songs || []);
    if (json === songsCache) return;
    songsCache = json;
    setDoc(songsRef, { songs: window.songs || [] })
      .then(() => setStatus('ok', 'Đã đồng bộ'))
      .catch(err => { songsCache = null; fail('ghi bài hát', err); });
  }

  function pushCfg() {
    if (!ready) return;
    // Chỉ đồng bộ số sao. Giọng đọc/tốc độ khác nhau theo từng thiết bị nên giữ riêng ở máy.
    setDoc(cfgRef, { stars: Number(window.cfg.stars) || 0 })
      .catch(err => fail('ghi số sao', err));
  }

  window.save = function () {
    try { localStorage.setItem('cfg', JSON.stringify(window.cfg)); } catch (e) {}
    pushCfg();
  };
  window.saveTopics = function () {
    try { localStorage.setItem('topics', JSON.stringify(window.topics)); } catch (e) {}
    pushTopics();
  };
  window.saveSongs = function () {
    try { localStorage.setItem('songs', JSON.stringify(window.songs)); } catch (e) {}
    pushSongs();
  };

  // ---- Nhận từ cloud ----
  let first = true;
  onSnapshot(col, (snap) => {
    if (snap.metadata.hasPendingWrites && !first) return;   // bỏ qua "tiếng vọng" của chính mình
    const docs = {};
    snap.forEach(d => { docs[d.id] = d.data(); });

    const topicDocs = Object.keys(docs).filter(k => k.startsWith('topic_'))
      .map(k => docs[k]).sort((a, b) => (a.order || 0) - (b.order || 0))
      .map(t => { const o = Object.assign({}, t); delete o.order; return o; });

    if (first) {
      first = false;
      const legacy = docs[legacyId];
      if (topicDocs.length === 0) {
        // Cloud chưa có chủ đề nào theo cấu trúc mới
        if (legacy && Array.isArray(legacy.topics) && legacy.topics.length) {
          window.topics = legacy.topics;                     // chuyển từ document cũ
        } else if (!hadLocalTopics) {
          // máy này cũng chưa có gì → giữ dữ liệu mẫu, KHÔNG đẩy lên cloud
        }
        ready = true;
        if (hadLocalTopics || (legacy && legacy.topics)) pushTopics();   // đẩy dữ liệu thật lên cloud
      } else {
        window.topics = topicDocs;                           // cloud là nguồn chuẩn
        ready = true;
      }
      if (!docs.songs) {
        if (legacy && Array.isArray(legacy.songs) && !hadLocalSongs) window.songs = legacy.songs;
        ready = true;
        if (hadLocalSongs || (legacy && legacy.songs && legacy.songs.length)) { songsCache = null; pushSongs(); }
      }
      topicDocs.forEach(t => topicCache.set(t.id, JSON.stringify(Object.assign({}, t, { order: topicDocs.indexOf(t) }))));
    } else {
      window.topics = topicDocs.length ? topicDocs : window.topics;
      topicCache.clear();
      topicDocs.forEach((t, i) => topicCache.set(t.id, JSON.stringify(Object.assign({}, t, { order: i }))));
    }

    if (docs.songs && Array.isArray(docs.songs.songs)) {
      window.songs = docs.songs.songs;
      songsCache = JSON.stringify(window.songs);
    }
    if (docs.cfg && docs.cfg.stars !== undefined) window.cfg.stars = Number(docs.cfg.stars) || 0;

    try { localStorage.setItem('topics', JSON.stringify(window.topics)); } catch (e) {}
    try { localStorage.setItem('songs', JSON.stringify(window.songs)); } catch (e) {}
    try { localStorage.setItem('cfg', JSON.stringify(window.cfg)); } catch (e) {}

    setStatus('ok', 'Đã đồng bộ');
    if (window.render) window.render();
    if (window.stars) window.stars();
  }, (err) => fail('đọc dữ liệu', err));

  try {
    drawBar();
    window.render();
  } catch (e) { console.error(e); }
</script>
